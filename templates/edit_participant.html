<!DOCTYPE html>
<html>
<head>
    <title>Edit Participant</title>
</head>
<body>

<h1>Edit Participant</h1>

<form method="POST">

    <label>Name</label><br>
    <input type="text"
           name="name"
           value="{{ participant.Name }}"
           required>
    <br><br>

    <label>Email</label><br>
    <input type="email"
           name="email"
           value="{{ participant.Email }}"
           required>
    <br><br>

    <label>Start Date</label><br>
    <input type="date"
           name="startdate"
           required>
    <br><br>

    <button type="submit">
        Update Participant
    </button>

</form>

</body>
</html>
