<!DOCTYPE html>
<html>
<head>
    <title>Add Transaction</title>
</head>
<body>

<h2>Add Point Transaction</h2>

{% if error %}
    <p role="alert">{{ error }}</p>
{% endif %}

{% if not rules %}
    <p>No active point rules are available.</p>
{% else %}
<form method="POST">

    <label>Participant ID</label><br>
    <input type="number" name="participant_id" required><br><br>

    <label>Point Rule</label><br>
    <select name="rule_id" required>
        {% for rule in rules %}
            <option value="{{ rule['RuleID'] }}">
                {{ rule['ActivityName'] }} ({{ rule['Points'] }} points)
            </option>
        {% endfor %}
    </select><br><br>

    <label>Activity Date</label><br>
    <input type="date" name="activity_date" required><br><br>

    <label>Notes</label><br>
    <input type="text" name="notes"><br><br>

    <button type="submit">Save Transaction</button>

</form>
{% endif %}

</body>
</html>
