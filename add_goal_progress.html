<!DOCTYPE html>
<html>
<head>
    <title>Add Goal Progress</title>
</head>
<body>

<h1>Add Goal Progress</h1>

<form method="POST">

    <label>Goal ID</label><br>
    <input type="number" name="goal_id" required>
    <br><br>

    <label>Participant ID</label><br>
    <input type="number" name="participant_id" required>
    <br><br>

    <label>Current Points</label><br>
    <input type="number" name="current_points" required>
    <br><br>

    <label>Completed</label><br>
    <select name="completed">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
    </select>
    <br><br>

    <button type="submit">
        Save Goal Progress
    </button>

</form>

</body>
</html>
