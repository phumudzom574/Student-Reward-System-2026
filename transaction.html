<!DOCTYPE html>
<html>
<head>
    <title>Transactions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #003366;
            margin-bottom: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #003366;
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            background: #003366;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
        }
    </style>

</head>

<body>

    <a href="/" class="back-btn">Back to Dashboard</a>

    <div class="container">

        <h1>Point Transactions</h1>

        <table>

            <thead>
                <tr>
                    <th>Transaction ID</th>
                    <th>Participant ID</th>
                    <th>Rule ID</th>
                    <th>Activity Date</th>
                    <th>Points</th>
                    <th>Notes</th>
                </tr>
            </thead>

            <tbody>

                {% for transaction in transactions %}

                <tr>

                    <td>{{ transaction[0] }}</td>

                    <td>{{ transaction[1] }}</td>

                    <td>{{ transaction[2] }}</td>

                    <td>{{ transaction[3] }}</td>

                    <td>{{ transaction[4] }}</td>

                    <td>{{ transaction[5] }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>
</html>
